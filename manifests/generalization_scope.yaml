# Out-of-distribution scope matrix.
# What the six-cell UYPYDJ evidence does and does not cover.
# Status vocabulary: COVERED / PARTIAL / NOT COVERED / EVIDENCE REQUIRED

# WHAT MAY BE CITED FROM THIS FILE
#
# Every field outside `model_dependent` is a fact about the DATA - how many
# cells, which protocols, which temperatures were run, what a fold holds out.
# Those are true whatever estimator is used, and a contract or a manuscript
# scope statement may cite them.
#
# Everything a particular model measured lives under `model_dependent`, with
# the table it came from.  Those numbers move when the estimator changes, so
# citing them as scope confuses "what the data covers" with "how well this
# model did on it" - which is how a scope claim quietly becomes a performance
# claim.  The two were mixed in this file until 2026-09-01.
#
# tests/test_scope_manifest_fields.py enforces the split.
field_policy:
  citable_for_scope: [status, detail, claim_limit, confounded_with_cell,
                      downgraded_2026_08_31, gap, note]
  not_citable_for_scope: [model_dependent]
  rule: >
    A measured model result may appear ONLY under an axis's model_dependent
    key, and that key must name the table it came from.

axes:
  cell:
    status: PARTIAL
    detail: >
      Six cells, leave-one-cell-out everywhere.  Six is the whole population
      HERE, so cell-to-cell uncertainty is estimated from six clusters - wide
      intervals, reported as a cell-cluster bootstrap in
      safety_strict_*.csv.
    downgraded_2026_08_31: >
      This read COVERED, which invites the wrong reading.  Six cells is enough
      to hold one out and to bootstrap an interval, and that is what the SOP
      and SOH numbers rest on - but six cells from one order of one model is
      not a manufacturing population.  Nothing here estimates lot-to-lot,
      supplier or vintage variation, and the external dataset adds ONE more
      cell rather than a second population.
    claim_limit: >
      "leave-one-cell-out over six cells of one model, plus one external
      cell".  Never "generalises across cells", and never a statement about
      the INR21700-30T as a part number.
  protocol:
    status: PARTIAL
    detail: >
      Five distinct fast-charge protocols (CC, CC second cell, boost,
      boost+negative pulse, boost+1 s negative pulse, boost+rest).  This is
      the axis the dataset was built to vary.
    confounded_with_cell: >
      One physical cell per protocol, so protocol and cell identity are
      confounded: holding out BOOST_REST holds out a protocol AND a cell, and
      no result here can say which of the two moved.  CC and CC_CELL2 are the
      single exception - same protocol, different cell - and they are the
      only clean read on cell-to-cell variation in the whole set.
    model_dependent:
      note: >
        Measured with a particular estimator.  It illustrates the confound; it
        is not part of the data-design scope and a contract must not cite it.
      soc_percell_spread: >
        The per-cell mean-of-six spans 1.834 to 2.474 %p across all six, a
        1.35x spread, while the CC / CC_CELL2 pair alone spans 1.834 to
        2.372, a 1.29x spread - nearly all of the apparent protocol spread is
        available from two cells running the same protocol.
      table: analysis/results/tables/soc_percell.csv
    claim_limit: >
      "six protocol-cell combinations", never "generalises across charge
      protocols" - the design cannot separate the two.
  aging_state:
    status: COVERED
    detail: "SOH 1.00 down to ~0.68, ~1400-1900 cycles per cell."
  temperature:
    status: NOT COVERED
    model_dependent:
      note: >
        A measured consequence of one estimator on one external cell, kept
        because it sizes the risk, but not a data-design fact.
      table: analysis/results/tables/chen2026_baseline.csv
      measured_consequence: >
        Quantified on 2026-08-27.  Running Chen 2026's constant-power search
        with this project's pooled ECM on RPCWBY Test#3 (tau = 10 s) gives an
        SOP RMSE of 1.7-4.2 W at 0, 10, 25 and 40 C but 17.5 W at -10 C and
        36.2 W at -20 C, with a +29.2 W optimistic bias against a 30.8 W
        measured mean.  The model predicts roughly double the available power
        at -20 C.
    detail: >
      UYPYDJ is 25 C throughout.  The 28 files logging ~0 C are a sensor
      fault, not a cold test - HPPC resistance in those cycles sits on the
      aging trend line (ratio 0.98 vs neighbours where 0 C would give 3-5x).
      The temperature factor comes from the Mendeley sweep on a DIFFERENT,
      un-aged cell.  No aged-cell low-temperature data exists here.
    claim_limit: >
      Do not claim aged low-temperature generalization.  Temperature and
      aging are never crossed in this evidence.
  laboratory:
    status: PARTIAL
    detail: >
      RPCWBY is a second laboratory and a second cell of the same part, but it
      contributes ONE physical cell.  The six "folds" carried to it are six
      UYPYDJ models scored on that same data - six models, not six cells - so
      their outcomes are correlated and "external multi-cell validation" is
      forbidden regardless of what any of them measures.  That is a fact about
      the data, and it does not depend on which estimator is carried across.
    model_dependent:
      note: >
        What the carried models actually did.  Reported, but not part of the
        data-design scope: change the estimator and every number here moves.
      tables:
        - analysis/results/tables/chen2026_baseline.csv
        - analysis/results/tables/external_a8_safety.csv
        - analysis/results/tables/external_a8_surfaces.csv
      physics_layer: >
        The physics-only model is scored on RPCWBY Test#3 across six
        temperatures under Chen 2026's search framework, a real
        cross-laboratory result for the ECM.
      frozen_trim: >
        [UPDATED 2026-08-31]  repro/run_external_a8.py carries all six
        leave-one-cell-out A8 folds to RPCWBY Test#2 without refitting
        anything, including lambda.  Discharge: the frozen lambda stays
        conservative, zero exceedance across all six folds, worst margin 1.125
        over the six internal surfaces (37.18).  Charge: it does NOT transfer
        - it would need 0.3969 against the shipped 0.5860, and it overshoots
        on 9-11 of 248 in-hull rows per fold.  Coverage: 54.2 % of discharge
        calls and 70.3 % of charge calls are in hull, and the pooled surface
        hull never reaches below SOC 0.30 at any temperature, so nothing below
        that is shown.

  drive_profile:
    status: PARTIAL
    detail: >
      [UPDATED 2026-08-31]  UYPYDJ drive cycles plus RPCWBY Test#2 US06, on
      one external cell, through repro/run_external_a8.py with nothing
      refitted.  Discharge transfers, charge does not.  Still one drive
      profile family per dataset, so no claim of drive-profile generality.
  chemistry:
    status: NOT COVERED
    detail: "One chemistry, one cell model (Samsung INR21700-30T)."
    claim_limit: "No chemistry-wide claim is supported."
  pack:
    status: NOT COVERED
    detail: >
      analysis/sop_pack2.py resamples single-cell evaluation rows within
      condition groups.  There is no pack hardware and no HIL.  Missing from
      the simulation: inter-cell error correlation beyond the condition
      bin, a shared current trajectory through time, thermal gradient, and
      state-of-charge imbalance.
    claim_limit: >
      Call it "pack-level simulation sensitivity", never "pack validation".
