# Out-of-distribution scope matrix.
# What the six-cell UYPYDJ evidence does and does not cover.
# Status vocabulary: COVERED / PARTIAL / NOT COVERED / EVIDENCE REQUIRED

axes:
  cell:
    status: COVERED
    detail: >
      Six cells, leave-one-cell-out everywhere.  Six is the whole population,
      so cell-to-cell uncertainty is estimated from six clusters - wide
      intervals, reported as a cell-cluster bootstrap in
      safety_strict_*.csv.
  protocol:
    status: COVERED
    detail: >
      Five distinct fast-charge protocols (CC, CC second cell, boost,
      boost+negative pulse, boost+1 s negative pulse, boost+rest).  This is
      the axis the dataset was built to vary.
  aging_state:
    status: COVERED
    detail: "SOH 1.00 down to ~0.68, ~1400-1900 cycles per cell."
  temperature:
    status: NOT COVERED
    measured_consequence: >
      Quantified on 2026-08-27.  Running Chen 2026's constant-power search
      with this project's pooled ECM on RPCWBY Test#3 (tau = 10 s) gives an
      SOP RMSE of 1.7-4.2 W at 0, 10, 25 and 40 C but 17.5 W at -10 C and
      36.2 W at -20 C, with a +29.2 W optimistic bias against a 30.8 W
      measured mean.  The model predicts roughly double the available power
      at -20 C.  See analysis/results/tables/chen2026_baseline.csv.
    detail: >
      UYPYDJ is 25 C throughout.  The 28 files logging ~0 C are a sensor
      fault, not a cold test - HPPC resistance in those cycles sits on the
      aging trend line (ratio 0.98 vs neighbours where 0 C would give 3-5x).
      The temperature factor comes from the Mendeley sweep on a DIFFERENT,
      un-aged cell.  No aged-cell low-temperature data exists here.
    claim_limit: >
      Do not claim aged low-temperature generalization.  Temperature and
      aging are never crossed in this evidence.
  laboratory:
    status: PARTIAL
    detail: >
      The physics-only model is now scored on RPCWBY Test#3 across six
      temperatures under Chen 2026's search framework (see
      chen2026_baseline.csv), which is a real cross-laboratory result for
      the ECM.
      [UPDATED 2026-08-31]  The frozen A8 trim HAS since been scored outside
      UYPYDJ.  repro/run_external_a8.py carries all six leave-one-cell-out A8
      folds to RPCWBY Test#2 without refitting anything, including lambda.
      Result, and the scope matters more than the headline:
        - RPCWBY contributes ONE physical Samsung 30T cell.  The six "folds"
          are six UYPYDJ models on that same data - six models, not six cells
          - so their exceedance counts are correlated.  "External multi-cell
          validation" is forbidden.
        - discharge: the frozen lambda stays conservative, margin 1.30-1.43,
          zero exceedance across all six folds.
        - charge: it does NOT transfer.  It would need 0.3969 against the
          shipped 0.5860 and overshoots on 9-11 of 248 in-hull rows per fold.
        - coverage: 54.2 % of discharge calls and 70.3 % of charge calls are
          in hull.  The pooled surface hull never reaches below SOC 0.30 at
          any temperature, so nothing below that is shown.
      Artifacts: external_a8.csv, external_a8_coverage.csv,
      external_a8_safety.csv.  Test#3 still carries no paired drive cycle, so
      the temperature sweep bounds the nominal 2RC layer only, not the trim
      (external_temp_envelope.csv, spec 37.4).
  drive_profile:
    status: PARTIAL
    detail: >
      [UPDATED 2026-08-31]  UYPYDJ drive cycles plus RPCWBY Test#2 US06, on
      one external cell, through repro/run_external_a8.py with nothing
      refitted.  Discharge transfers, charge does not.  Still one drive
      profile family per dataset, so no claim of drive-profile generality.
  chemistry:
    status: NOT COVERED
    detail: "One chemistry, one cell model (Samsung INR21700-30T)."
    claim_limit: "No chemistry-wide claim is supported."
  pack:
    status: NOT COVERED
    detail: >
      analysis/sop_pack2.py resamples single-cell evaluation rows within
      condition groups.  There is no pack hardware and no HIL.  Missing from
      the simulation: inter-cell error correlation beyond the condition
      bin, a shared current trajectory through time, thermal gradient, and
      state-of-charge imbalance.
    claim_limit: >
      Call it "pack-level simulation sensitivity", never "pack validation".
