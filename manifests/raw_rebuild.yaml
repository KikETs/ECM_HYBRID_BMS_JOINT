# raw-to-result rebuild, 2026-08-27
#
# The full pipeline was rebuilt from the raw archives (30 stages, tier 1-5,
# --force) and the resulting tables compared cell by cell against the ones
# committed at 816e9c4.

run:
  stages: 30
  wall_clock_h: 3.2
  recorded_estimate_h: 13.4
  note: "the per-stage minutes in stages.py are stale and pessimistic on this machine"

result:
  differing_numeric_cells: 235
  tables_affected: 10
  relative_change_median_pct: 0.0729
  relative_change_p95_pct: 0.6072
  relative_change_max_pct: 6.2500

unchanged_exactly:
  - "safety.csv lambda for A8, both directions and both horizons (0.470, 0.679, 0.553, 0.561)"
  - "safety.csv usable current for A8 (55.8, 56.6, 57.8, 70.3 %)"
  - "ladder.csv usable current for A3 and A8"
  - "soh.csv in full - the SOH arm does not touch the trim cache"
  - "mcu.csv, pack.csv, soc_perturb.csv, end_to_end.csv, external_a8.csv"

cause: >
  Not nondeterminism.  sop_trim_dataset.py carries the drive-defect
  exclusion added in sec 33.4; the shipped cache predates it.  Section 33.4
  states this explicitly - "rebuilding the dataset next time picks it up
  automatically" - and predicts the exact numbers a rebuild would give.

cause_corrected_2026_08_31: >
  [BOTH EARLIER ACCOUNTS WERE WRONG — this is the measured one.]

  "The shipped cache predates it" is not what was stale.  cache/trim and
  cache/trim_chg were rebuilt from scratch on 2026-08-31 and came back
  BYTE-IDENTICAL: same row counts for all six cells in both directions, X and
  Y allclose.  Seventy minutes of wall clock to establish that.

  A second guess - that the committed MODELS predated the fix - was also
  wrong.  Their training labels Y are identical to the retrained ones in all
  six cells, so they were fitted on the same data.  Only the weights differed,
  by 0.02-0.06 % in prediction.

  What it actually is: sop_baseline_fill.py's fit_alpha is an argmin over
  np.linspace(0, 1, 51), step 0.02 - a step function of its input.  Training
  was seeded but not deterministic (cuDNN kernel choice, unordered CUDA
  reductions, no fixed cuBLAS workspace), so two fits differed by ~0.05 %, and
  that was enough to move the argmin one step and land as a 2.5 % change in a
  published voltage RMSE.  This file had already called alpha_slow
  0.32 -> 0.34 "a grid quantum, not a measurement drift" without connecting it
  to the reproducibility claim.

  The nondeterminism was INTERMITTENT, which is why running the pipeline twice
  and getting the same answer had not caught it: committed models against a
  retrain differed by 0.05 %, and that retrain against a
  determinism-enabled run was bit-identical.

  Both wrong diagnoses were reached by inference where a measurement was
  available - the cache was never compared against the defect list, and the
  labels were never compared at all.

determinism_2026_08_31:
  cache: "cache/trim and cache/trim_chg rebuilt from scratch, both directions, six cells each - byte-identical, so sop_trim_dataset.py is deterministic and the cache was never the stale link (70 min wall clock)"
  training_before: "seeded only; two fits differed by 0.02-0.06 % in prediction, intermittently"
  training_after: "analysis/determinism.py - same command twice gives bit-identical predictions and checkpoints that hash the same"
  a_model_that_could_never_be_reproduced: "torch.use_deterministic_algorithms(True) refused to train the SOH CNN because adaptive_avg_pool2d_backward_cuda has no deterministic implementation.  Replaced with the exactly equivalent AvgPool1d on this input (max |delta| 0); the CNN now reproduces bit for bit and its worst cell moved 0.0293 -> 0.0291"
  rest_of_the_chain: "checked, not assumed - eval_sop_amps.py works in NumPy on stored predictions, and every table producer that uses randomness seeds it"

decision: RESOLVED 2026-08-31 - retrain deterministically, adopt the result
decision_detail: >
  Section 33.4 decided to keep the pre-fix cache because the deployment
  metrics do not move and 38 verified numbers stood on it.  This rebuild
  confirms the deployment metrics still do not move.  The audit therefore
  restored the committed artifacts rather than silently switching which
  numbers the paper reports.  Adopting the rebuilt set is defensible and
  arguably more correct - the defect exclusion is the right processing -
  but it would change seven published voltage RMSE values and the spec
  tables in sec 32.2 and 32.6 that quote them.  That is the author's call.
  [SUPERSEDED 2026-08-31] Taken.  Leaving committed models that were fitted
  on data the repository no longer produces is not a defensible position for
  a reproduction package: a clean clone cannot arrive at the published
  numbers, which is the whole claim.  The trims were retrained on the current
  cache and every downstream table regenerated.  Section 37 records what
  moved.
rebuilt_artifacts: "../preserved/rawrebuild_output/rebuilt_artifacts.tar.gz"
