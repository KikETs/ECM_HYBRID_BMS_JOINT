# MCU deployment evidence.
#
# First measured during the audit on 2026-08-27.  Re-measured on 2026-08-31
# after a review found this file still describing the leave-one-cell-out
# header while the ledger described the all-cell one: the firmware was
# rebuilt from current sources, re-flashed, and re-benchmarked, and every
# number below is from that run.
board:
  part: "STM32H563ZIT6 (NUCLEO-H563ZI)"
  core: "Cortex-M33, 250 MHz, FPv5-SP hard FPU, ICACHE on"
  probe: "ST-LINK V3, serial 0024003C3235511138363730"
  port: "/dev/ttyACM0, USART3 921600 baud"
  clock_hz_reported_by_firmware: 250000000
toolchain:
  compiler: "arm-none-eabi-gcc (GNU Tools for STM32 14.3.rel1.20251027-0700) 14.3.1 20250623"
  cflags: "-mcpu=cortex-m33 -mthumb -mfpu=fpv5-sp-d16 -mfloat-abi=hard -std=gnu11 -Os -ffunction-sections -fdata-sections -fstack-usage --specs=nano.specs"
  hal: "STM32Cube_FW_H5_V1.7.0"
  programmer: "STM32_Programmer_CLI 2.2.500"
firmware:
  comparison_build:
    model_id: nmc_dst_cc
    text_B: 72700
    data_B: 92
    bss_B: 13172
    elf_sha256: "7d3996f8ce0ef9d473fa0cd2fb36d9a1f6a0ddacaf37828d0ff930faf6879964"
    bin_sha256: "188520672b1075e4534bf3c7816c728dc3832018c1774531b0172fa1d53555fd"
    changed_from_audit: >
      143932 B on 2026-08-27; 143964 B after the all-cell SOP header; 72700 B
      now.  The 71264 B drop is the 1D CNN leaving: replaced by ridge, the SOH
      arm is 65 coefficients instead of 3 x 10945 parameters, and the int8
      kernel in soh_simd.c compiles to nothing.  bss falls with it, 28276 ->
      13172 B, because the CNN's activation buffers are gone.
      analysis/results/tables/build_size.csv was regenerated to match.
  deployment_build_a8_only:
    model_id: a8_only
    text_B: 70796
    data_B: 92
    bss_B: 13172
    elf_sha256: "d7c9722663ab906ab3408dccca452be7fb40b3ddf028d1eae53c6097adada4ad"
    bin_sha256: "df1431c8b62267130a8511dd049547cf2d1e290265ba85a7ac19d76d3615b755"
    note: "make EXTRA_CFLAGS=-DSOP_A8_ONLY MODEL_ID=a8_only; 1904 B smaller"
model_on_board:
  rung: A8
  header: "mcu/sop_tables.h (fw_sop/Inc/sop_tables.h is now a symlink to it)"
  fit: "all-cell (--deployment, model_A8_ALL.pt), NOT a leave-one-cell-out fold"
  header_sha256: "586af0456e5dd1a5d97f6573448fa1b6b10a1e59dec1bee5a7ba418e2d57d499"
  header_reproduces_from_the_stage_graph: >
    repro/stages.py mcu_export now runs export_mcu_tables.py --rung A8
    --deployment --trim runs_trim_a8_deploy --trim-chg runs_trim_a8_chg_deploy,
    and that command regenerates the committed header byte for byte.  Before
    this fix the stage still carried the default leave-one-cell-out
    directories, so re-running the graph would have silently replaced the
    shipped header with a fold.
  binary_evidence: >
    Searching the objcopy'd image for IEEE-754 little-endian patterns:
    trim_w_dis[0] = 0.2107657 (all-cell, f7d2573e) occurs once; the
    leave-one-cell-out CC fold 0.2146806 (3bd55b3e) and the A3 rung value
    0.2283459 (82d3693e) do not occur at all.
  effective_coefficients: 4
  shipped_coefficients: >
    50 floats (24 weights + 2 biases + 12 mu + 12 sd).  The layer is a
    12-input linear map with 11 input columns trained to ~1e-41.  Report
    "four effective deployed coefficients", not "four parameters".
  provenance_resolved: >
    Resolved 2026-08-31.  This file previously recorded the CC fold, which
    contradicted .paper_state/evidence_ledger.yaml.  The ledger was right and
    this manifest was stale.  The all-cell fits exist
    (analysis/runs_trim_a8_deploy/model_A8_ALL.pt and the charge twin), the
    header is exported from them, and the image on the board was rebuilt and
    re-flashed from current sources to confirm it.
  what_leave_one_cell_out_still_governs: >
    Every accuracy and safety number in the paper.  The all-cell fit is the
    artifact; it is not separately validated, and it cannot be -- there is no
    seventh cell to hold out.  The leave-one-cell-out numbers are the honest
    estimate of what it will do on a cell it has not seen.
size_units:
  note: "text/data/bss are bytes. 142060 B = 138.7 KiB = 142.1 kB (decimal)."
timing_us:
  n: 500
  remeasured_2026_08_31: >
    An independent 500-sample sweep on the freshly flashed all-cell image
    reproduced analysis/results/tables/mcu.csv: FULL median 50.52 us, p95
    56.42, max 73.32 -- identical to the stored table, which was therefore
    already measured on the deployment model.  FEAT differs in the last digit
    (13.26 vs 13.27 us median) as expected for a re-run.
    repro/run_mcu_table.py --check confirms mcu.csv still reproduces from the
    committed mcu/sop_mcu_bench.csv, which is kept as the record of the run
    that produced the published table.
  method: "DWT CYCCNT, interrupts disabled, call region only"
  derived_from: "analysis/results/tables/mcu_cycle.csv"
  superseded_hand_entered_fields: >
    per_sample_median 13.09, per_sample_wcet 13.85, per_decision_median
    201.74, per_decision_wcet 293.26, full_cycle_median 214.83,
    full_cycle_wcet 307.12.  These were typed in by hand and went stale twice
    - they were still the pre-ridge firmware after the board had been
    reflashed and re-measured.  A number a human retypes after every
    measurement is a number that will be wrong, so run_mcu_table.py now
    derives the composite into mcu_cycle.csv and verify.py checks it.
  full_cycle_median: 227.79
  full_cycle_wcet: 339.84
  composition: "one SOC EKF step + one A8 feature update + four SOP inversions"
  per_sample_median: 6.79
  per_decision_median: 212.84
  stack_high_water_B: 560
  stack_high_water_changed: >
    624 B on 2026-08-27, 560 B now.  Same measurement (the maximum the
    firmware reports across the sweep), different firmware: the unknown-command
    NACK path added during the audit changed the worst-case call chain.  No
    published table quotes the stack figure.
  load_at_100Hz_median_pct: 2.278
  load_at_100Hz_wcet_pct: 3.398
  soh_model: >
    MEASURED 2026-08-31, and no longer a CNN.  mcu/bench_soh.py sends real
    dQ/dV curves from the cache and checks the board's answer against NumPy.
    ridge  6.50 us median (p95 6.50, max 7.84), 282/282 answers within 2e-4
           of the same fit computed in NumPy
    CNN    19442.25 us median, measured on the superseded image before it was
           replaced.  The ledger's earlier "17.9 ms, unmeasured" was an
           estimate; the real figure is 19.4 ms.
    Speed-up 2991x.  SOH is not in the control cycle either way -- it runs once
    per charge -- so this buys headroom, not cycle budget.
parity:
  script: "python3 repro/run_parity.py --n 5000"
  max_rel_diff: 9.233e-06
  quantities: "kf, ks, R_eff, I_star"
  iteration_diffs: "12 / 5000 cases differ by 1 (float32 rounding at the stopping threshold)"
  result: PASS

soh_replacement_2026_08_31:
  what: >
    The 1D CNN was replaced by ridge on the same 64-point dQ/dV input.  It is
    better on every held-out cell (pooled RMSE 0.0094 against 0.0135, worst
    cell 0.0130 against 0.0291), it is 65 coefficients against 32835
    parameters, and it halves the firmware.
  why_not_selection_on_the_test_set: >
    Because the family was re-chosen by a procedure that never sees the
    held-out cell: repro/run_soh_nested.py scores every candidate by
    leave-one-cell-out over the five TRAINING cells, then refits the winner.
    The CNN placed last on all six folds (inner RMSE 0.0103-0.0184 against
    ridge's 0.0088-0.0105); it would never have been selected by anything that
    had not already seen the test cells.  Ridge is chosen on four folds and
    gradient boosting on two; ridge is deployed because the procedure's own
    pooled error, 0.0095, is indistinguishable from always-ridge at 0.0094 and
    a 65-coefficient linear map is what fits on the part.
  header_sha256: "f1b46e75fd1e0c7f15ae8e0ba51ea40d57defb19532959f4d633a470a4e5d4a3"
  firmware_evidence: >
    Same source, same board, minutes apart; only mcu/soh_tables.h differs.
    SOP_CMD_SOH_Q is refused by the ridge build (NACK 0xFFFFFFFE with the
    opcode echoed) rather than answered with the float timing under the
    integer opcode.
  sop_slowdown_is_placement_not_work: >
    Removing 71 kB of unrelated code made the SOP inversion 5.3 % SLOWER
    (FULL 50.50 -> 53.20 us).  It is an instruction-cache placement effect,
    not a cost of ridge: rebuilt with -DSOP_NO_ICACHE, the same two images give
    107.89 us (CNN) against 106.38 us (ridge), so with the cache off the
    ordering reverses and ridge is 1.4 % faster.  All twelve hot functions
    moved by 0x1C-0x20 bytes and eight changed their 32-byte alignment.
    Artifact: analysis/results/tables/mcu_icache.csv.
  published_timings_all_remeasured: >
    analysis/results/tables/mcu.csv is from the deployment image, n=500:
    FULL 53.20 us median, p95 59.56, max 81.09.  The 50.52 us in the earlier
    draft was the CNN image and is superseded.

retrain_2026_08_31:
  what: >
    The trims were retrained on the current cache (see raw_rebuild.yaml) and
    the deployment header re-exported from the new all-cell fits.
  header_weight: "trim_w_dis[0] 0.2105654 -> 0.2107657 (+0.095 %)"
  binary_evidence: >
    The flashed image contains 0.2107657 (f7d2573e) once; 0.2105654, the
    leave-one-cell-out CC fold 0.2146806 and the A3 value 0.2283459 do not
    occur.
  timing_unchanged: >
    Re-measured n=500 after reflashing: FULL 53.21 us median against 53.20
    before, a one-cycle difference (13302 against 13301).  Every other stage
    is identical to the cycle except TRIM, 1674 against 1673.  Retrained
    weights do not change the cost.
  firmware_size_unchanged: "text 72700 B, bss 13172 B - identical"
