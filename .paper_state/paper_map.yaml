# Which artifact backs which paper claim.
# Every entry names a table, a producer command, and its ledger status.
version: 1
base_commit: fa44137ad7ca39b75a044538d7b4db3cbf3a5ed1
audit_branch: audit/etransportation-readiness
audited: "2026-08-27"
manuscript_updated: "2026-08-28"
manuscript_note: >
  Section 34 of docs/sop_hybrid_spec.md now carries the audit
  findings, and each contradicted claim is marked at the site where
  it was made rather than deleted - the reasoning that produced it
  is still worth reading, as sec 26.5 argued. findings.md carries a
  banner and its adopted-summary table is corrected. repro/qc.py
  guards all six retractions and now scans README.md too.

claims:
  - id: sop.usable_current
    text: "usable current 69.1 % discharge, 59.6 % charge at zero exceedance"
    table: safety.csv
    producer: "python3 repro/run_safety.py"
    ledger: safety_calibration
    status: CONTRADICTED
    replacement: >
      Use safety_strict_oracle.csv.  Strict per-cell held-out calibration
      gives 69.6 % discharge / 59.5 % charge at 10 s with 1 exceedance each,
      not zero.

  - id: sop.lambda
    text: "discharge 0.683 / 0.470, charge 0.586 / 0.560"
    table: safety.csv
    producer: "python3 repro/run_safety.py"
    ledger: safety_calibration
    status: PARTIAL
    note: "These are the pooled-median lambdas.  Per-cell held-out lambdas span 0.683-0.708 (discharge 10 s)."
    replacement: >
      Current, from safety_strict_oracle.csv after the deterministic retrain:
      pooled-median lambda 0.6834 (discharge 10 s), 0.4703 (discharge 2 s),
      0.5862 (charge 10 s), 0.5601 (charge 2 s).  PARTIAL because one number
      hides the spread: the per-cell held-out values run 0.6834-0.7081 on
      discharge 10 s, and it is the smallest of them a deployment must ship.
      Quote the pooled median with its range, never alone.

  - id: sop.ladder
    text: "A8 beats A0 by ~10 %p usable current; A8 >= A3 on charge"
    table: ladder.csv
    producer: "python3 repro/run_safety.py"
    status: VERIFIED
    robustness: "Holds at every extrapolation ceiling (label_sensitivity.csv)."

  - id: sop.voltage_rank_flip
    text: "ranking by voltage RMSE picks wrong in 3 of 4 settings"
    table: voltage.csv + ladder.csv
    producer: "python3 repro/run_voltage.py && python3 repro/fig_ladder.py"
    status: VERIFIED
    note: >
      The figure previously drew one horizon-agnostic voltage RMSE in both
      the 2 s and 10 s panels.  voltage.csv now carries tau_s and the figure
      matches horizons.  Discharge 10 s still preserves rank exactly
      (Spearman +1.00); charge 10 s moved from 3/6 to 4/6.

  - id: soh.rmse
    text: "SOH RMSE 0.0135, bias +0.0001"
    table: soh.csv
    producer: "python3 repro/run_soh_table.py"
    status: SUPERSEDED
    note: "Worst cell BOOST_REST is 0.0293 — 2.2x the pooled value.  Report it."
    replacement: >
      That is the 1D CNN's number, and it stopped being the SOH arm's result
      when ridge was adopted (36).  The arm is dQ/dV ridge, 65 coefficients:
      pooled RMSE 0.0094, bias -0.0005, worst cell 0.0130 - 1.4x the pooled
      value rather than 2.2x.  The CNN is now a comparison group beside PLS,
      SVR and gradient boosting, and nested selection does not pick it on any
      of the six folds.  Current values: soh.csv, soh_baselines.csv,
      soh_model_cost.csv.

  - id: soh.cnn_needed
    text: "a CNN is the right model for partial-charge SOH"
    table: soh_baselines.csv
    producer: "python3 repro/run_soh_baselines.py"
    status: CONTRADICTED
    replacement: "Ridge is better on the same splits (0.0094 vs 0.0135 pooled, 0.0130 vs 0.0293 worst cell)."

  - id: soc.headline
    text: "2.05 %p under sensor perturbation"
    table: soc_headline.csv
    producer: "python3 repro/run_soc_headline.py"
    status: CONTRADICTED
    replacement: "2.14 %p over the six disturbances; 2.05 %p only if the undisturbed row is included; worst condition 3.77 %p."
    note: >
      Since 37.13 the pooled number no longer travels alone: soc_percell.csv
      breaks it into six cells, 1.834 (CC) to 2.474 (BOOST_NEGPULSE_1S), a
      1.35x spread with a cell-cluster 95 % interval of [1.962, 2.326].  Quote
      it with the spread or not at all.

  - id: soc.percell.scope
    text: >
      (new, 37.13) The SOC spread is a per-cell CALIBRATED result, and cell is
      confounded with protocol.
    table: soc_percell.csv
    producer: "python3 repro/run_soc_percell.py"
    status: VERIFIED
    note: >
      Two limits travel with every SOC number.  Each filter reads its own
      cell's characterisation surface, so unlike the SOP and SOH arms this is
      not a leave-one-cell-out transfer and says nothing about an unseen cell.
      And the dataset runs one physical cell per protocol, so holding out a
      cell holds out a protocol too; CC / CC_CELL2 is the only same-protocol
      pair, and it alone spans 1.29x of the 1.35x total.  Say "six
      protocol-cell combinations".

  - id: ext.crate.margin
    text: >
      (new, 37.12/37.14) Test#8 at 0 C: the frozen lambda holds across prior
      discharge rates from 0 to 4C.
    table: external_crate_surfaces.csv
    producer: "python3 repro/run_external_crate.py --all-surfaces"
    status: VERIFIED
    note: >
      The conclusion is surface-independent - zero exceedance in all 48
      in-hull points against every one of the six internal surfaces - but the
      MARGIN is not.  It spans 1.351 (CC_CELL2) to 1.655 (CC), a 1.22x range,
      while prior C-rate moves it by about 1 % within any one surface.  37.12
      first published 1.655-1.672 because --holdout defaults to CC, which was
      the most favourable of the six.  Quote 1.351.  The 6.1 % upper bound is
      exact-binomial over rows of ONE physical cell, conditional on the
      tested SOC and prior-rate grid; it is not a cell- or population-level
      risk, and the six surface columns must not be pooled - they are the
      same 48 measurements scored six times.

  - id: mcu.cycle_time
    text: "214.8 us per control cycle, 142.1 KB flash"
    table: mcu_cycle.csv
    producer: "python3 repro/run_mcu_table.py"
    status: SUPERSEDED
    replacement: >
      Both figures moved twice - the ridge SOH arm and the deterministic
      retrain changed the image - and the manifest recording them went stale
      with them.  Per-cycle 227.79 us median; 339.84 us is the SUM OF STAGE
      MAXIMA, not a measured WCET - no integrated loop was timed.  2.278 %
      and 3.398 % of a 100 Hz budget; deployment build text 70796 B.  Derived
      into mcu_cycle.csv now instead of typed into a manifest (37.10).
    note: >
      Re-measured on hardware with the corrected A8 firmware: median
      214.83 us, WCET 307.12 us.  Flash: deployment build text 142060 B
      = 138.7 KiB = 142.1 kB decimal — state the unit.
      [SUPERSEDED 2026-08-31]  All three moved and none of them was noticed
      until a systematic sweep: the ridge SOH arm and the deterministic
      retrain changed the image.  Per-cycle median 227.79 us; 339.84 us is a
      derived budget, the sum of separately measured stage maxima, not a WCET;
      deployment build text 70796 B.  The composite is derived into
      mcu_cycle.csv now instead of being typed into a manifest.

  - id: mcu.model_identity
    text: "the board runs the adopted A8 model"
    ledger: mcu_deployment
    status: VERIFIED
    note: >
      True only after this audit.  At the base commit the firmware compiled
      A3 weights and the A8 header did not compile at all.

  - id: mcu.parameter_count
    text: "4 parameters"
    status: PARTIAL
    replacement: >
      "four effective deployed coefficients"; the header ships a 12-input
      layer (50 floats).  "A four-parameter model" is retracted and qc.py
      fails if it reappears (37.3).

  - id: external.rpcwby.a8
    text: "external validation of the frozen A8 on RPCWBY"
    table: external_a8.csv
    producer: "python3 analysis/rpcwby_us06_trim.py --test 2 && python3 repro/run_external_a8.py"
    ledger: external_validation
    status: VERIFIED_PROCESSED
    note: >
      Test#2, 375 rows, 10 and 25 C, all six frozen folds.  Charge: RMSE
      8.36 -> 7.21 W.  Discharge: RMSE 2.25 -> 3.65 W but optimism 51.2 ->
      20.7 % and the bias flips negative.  State both; do not quote only the
      one that flatters.

  - id: external.rpcwby.physics
    text: "cross-temperature behaviour of the physics model on RPCWBY"
    table: chen2026_baseline.csv
    producer: "python3 repro/run_chen2026_baseline.py"
    status: VERIFIED_PROCESSED
    note: >
      Test#3 under Chen 2026's search: 1.7-4.2 W at 0-40 C, 17.5 W at -10 C,
      36.2 W at -20 C with a +29 W optimistic bias.  A separate experiment
      from the A8 validation above - do not merge them.

  - id: sop.seq_baselines
    text: "a larger sequence model would do better"
    table: method_comparison.csv
    producer: "python3 repro/run_sop_seq_baselines.py"
    status: CONTRADICTED
    replacement: >
      Current, from method_comparison.csv: on discharge 10 s the ranking is
      A3 70.03 %, A8 69.61, GRU 69.54, LSTM 69.09, shrinkage 64.69, FFRLS
      43.28, and every bootstrap interval except FFRLS overlaps A8's.  Across
      the four direction x horizon conditions A8 places 3rd, 3rd, 2nd and 5th
      of six - never first - and 3 of 20 intervals separate from it, all three
      FFRLS.  A larger sequence model does not do better on the property the
      paper claims, at 1,100x the parameters; nor does the trim beat them.
      The supported word is "competitive" (37.3).
    note: >
      LSTM and GRU are 28-30 % better than A8 on voltage RMSE and
      statistically indistinguishable on usable current - all four bootstrap
      intervals overlap - with 1,100-1,500x the parameters.

  - id: soh.representation
    text: "the dQ/dV representation is what makes the SOH arm work"
    table: soh_ablations.csv
    producer: "python3 repro/run_soh_ablations.py"
    status: CONTRADICTED
    replacement: >
      Current, from soh_ablations.csv with the adopted ridge arm: dQ/dV alone
      0.0094, time-per-bin alone 0.0096, both together 0.0095.  The
      representation is not what makes the arm work.  What is load-bearing is
      the voltage WINDOW: a single 3.6-3.7 V band gives 0.0261, nearly three
      times worse.
    note: >
      dQ/dV, time-per-bin and both are 0.0094 / 0.0096 / 0.0095.  The
      representation is not load-bearing.  The full voltage window is.

  - id: mcu.deployment_fit
    text: "the shipped model"
    ledger: mcu_deployment.deployment_model
    status: VERIFIED
    note: >
      Now an all-cell fit by a pre-declared recipe, exported against an
      all-cell ECM pool, flashed and confirmed in the binary.  It carries no
      held-out score by construction; the validated numbers stay the LOCO
      folds.

  - id: pack.no_exceedance
    text: "zero pack exceedance for N = 1..192"
    table: pack.csv
    status: PARTIAL
    note: "Resampling simulation of single-cell rows, not a pack measurement.  Say 'pack-level simulation sensitivity'."
    replacement: >
      Current, from pack.csv: 0.0 % exceedance at N = 1, 12, 48, 96 and 192 in
      both directions at the shipped lambdas.  Two qualifications travel with
      it or the claim is wrong.  It is a Monte Carlo resampling of single-cell
      evaluation rows within condition groups - there is no pack hardware, so
      "pack-level simulation sensitivity", never "pack validation" (qc.py
      fails if that phrase reappears).  And it holds AT those lambdas: 31.2
      reconfirmed it conditionally, not in general.  Omitted by construction:
      inter-cell error correlation beyond the condition bin, a shared current
      trajectory, thermal gradient, imbalance.

  - id: e2e.soc_penalty_magnitude
    text: >
      Estimated SOC takes discharge exceedance from 1 of 491 rows to 20 of 455
      (34.8).
    table: end_to_end_paired.csv
    producer: python3 repro/run_end_to_end.py
    ledger: end_to_end
    status: CONTRADICTED
    replacement: >
      The four corners were scored on four different row sets, because the
      trustworthy-label filter is computed from whichever SOC is in force.  On
      the 385 pulses all four keep, the fully estimated corner shows 4
      exceedances against 3 for the oracle corner.  The magnitude is withdrawn;
      see 35.1.
  - id: e2e.soc_mechanism
    text: >
      A wrong SOC is a bias the safety factor cannot price out (34.8).
    table: end_to_end_drift.csv
    producer: python3 repro/run_end_to_end.py
    ledger: end_to_end
    status: REPLACED
    replacement: >
      It is not a per-pulse bias at all.  25 of the fully estimated corner's 26
      discharge exceedances are in the 103 rows only that corner admits - a
      24.3 % rate against 0.94 % for the oracle corner's own extra rows.  A
      wrong SOC corrupts the admission rule, which is worse than a bias
      because a bias can be priced into lambda.  See 35.2.
      [SUPERSEDED 2026-08-31, third round]  Two things changed.  The numbers
      are now 27 of 97 rows, 27.84 %, against 0.97 % - the SOH arm is ridge and
      the trims were retrained.  And the wording is narrowed: no onboard
      admission filter was implemented or tested, so what is measured is the
      OFFLINE EVALUATION INCLUSION RULE being SOC-dependent.  See 37.2, and
      end_to_end_drift.csv for the current values.
  - id: sop.lambda_stability
    text: >
      One non-monotone row on charge was called an oddity nothing should be
      built on (34.8).
    table: end_to_end_paired.csv
    producer: python3 repro/run_end_to_end.py
    ledger: end_to_end
    status: REPLACED
    replacement: >
      It is a property, not an oddity.  lambda is fitted to bound the worst
      single training row, so one row moves the factor and the whole utility
      number: the oracle-SOH + estimated-SOC charge corner holds exceedance at
      1 only by dropping lambda to 0.4035 and 18 %p of usable current.  Any
      deployment on this lambda inherits it.  See 35.3.
  - id: external.safety_transfer
    text: >
      The frozen A8 transfers to RPCWBY Test#2 (34.7, reported as RMSE only).
    table: external_a8_safety.csv
    producer: python3 repro/run_external_a8.py
    ledger: external_validation
    status: PARTIAL
    replacement: >
      Split by direction.  On discharge the frozen lambda stays conservative -
      1.30-1.43x margin, zero exceedance in all six folds.  On charge it does
      NOT transfer: it would have to fall from 0.5860 to 0.3969, and as shipped
      it overshoots by up to 3.0 W on 9-11 of 248 in-hull rows per fold.  RMSE
      alone concealed this because RMSE is not the property the paper claims.
      See 35.5.
  - id: external.coverage
    text: >
      Out-of-hull calls were reported only as a total count (34.7).
    table: external_a8_coverage.csv
    producer: python3 repro/run_external_a8.py
    ledger: external_validation
    status: PARTIAL
    replacement: >
      The hull is a band in SOC, not an envelope: 0 % in hull at SOC <= 0.05
      and at SOC = 1.00, 7.7 % at 0.10, 42.3 % at 0.20, 100 % from 0.40 to
      0.95.  54.2 % of discharge calls are in hull.  Nothing about transfer
      below SOC 0.30 has been shown, and that is where discharge power limits
      bind.  See 35.5.
  - id: mcu.evidence_consistency
    text: >
      manifests/mcu_evidence.yaml recorded the leave-one-cell-out CC fold
      0.2146806 and a header hash matching no file in the tree.
    table: null
    producer: make && STM32_Programmer_CLI -w ... && python3 mcu/bench_sop.py
    ledger: mcu_deployment
    status: CORRECTED
    replacement: >
      The ledger was right and the manifest was stale.  The stage graph was
      also still exporting with the default leave-one-cell-out directories.
      Fixed, rebuilt, re-flashed and re-benchmarked on hardware: the image
      contains 0.2105654 once and neither 0.2146806 nor 0.2283459; FULL median
      50.52 us reproduces the stored table.  Two tests now fail if the manifest
      drifts from the header or from the ledger again.  See 35.4.
      [SUPERSEDED 2026-08-31, third round]  The CNN was replaced by ridge and
      the trims were retrained, so both figures moved: the flashed weight is
      0.2107657 and FULL is 53.21 us on a 72700 B image.  The 5.3 % rise over
      50.52 is an instruction-cache placement effect, not work - see 36.4.
      Current values: mcu.csv, mcu_icache.csv, mcu_evidence.yaml.
  - id: claim.production_ready
    text: >
      "Hybrid SOP / SOH / SOC for a production BMS" - the framing of the first
      draft.
    table: end_to_end_drift.csv
    producer: python3 repro/run_end_to_end.py
    ledger: end_to_end
    status: WITHDRAWN
    replacement: >
      Oracle-state validation overstates system safety.  What is supported is a
      bench result with a measured deployment cost, and a contribution of
      deployment-efficient equivalence under a safety-aware current utility -
      not superiority, and not a qualified production estimator.  See 35.8.
      [SUPERSEDED 2026-08-31, third round]  "Equivalence" is withdrawn too: no
      margin was pre-specified and no noninferiority test was run.  A8 places
      3rd, 3rd, 2nd and 5th of six across the four direction x horizon
      conditions and only FFRLS separates from it, so the supported word is
      COMPETITIVE.  See 37.3 and method_comparison.csv.
  - id: soh.model_family
    text: >
      The SOH arm is a 1D CNN, 10,945 parameters, leave-one-cell-out RMSE
      0.0135, worst cell 0.0293.
    table: soh_model_cost.csv
    producer: python3 repro/run_soh_nested.py && python3 analysis/soh_ridge.py
    ledger: soh_arm
    status: REPLACED
    replacement: >
      Ridge on the same input: pooled 0.0094, worst cell 0.0130, 65
      coefficients.  Not chosen by looking at the held-out cells - nested
      selection scores every family on the five training cells first, and the
      CNN places last on all six folds (inner 0.0103-0.0184 against ridge's
      0.0088-0.0122).  The procedure's own pooled error is 0.0095.  See 36.1.
  - id: soh.mcu_cost
    text: >
      "SOH CNN is not in the control cycle; runs once per charge (17.9 ms,
      unmeasured in this audit)".
    table: soh_model_cost.csv
    producer: python3 mcu/bench_soh.py
    ledger: mcu_deployment
    status: CORRECTED
    replacement: >
      Measured, both models, on the board.  CNN 19442.25 us - the 17.9 ms was
      an estimate and it was low.  Ridge 6.50 us, 2991x faster, with the
      board's answer checked against NumPy on 282 real curves.  Firmware text
      144012 -> 72700 B, bss 28276 -> 13172 B.  See 36.4.
  - id: mcu.timing_is_layout_sensitive
    text: >
      The board timings were reported as properties of the algorithms.
    table: mcu_icache.csv
    producer: python3 repro/run_soh_deploy_tables.py
    ledger: mcu_deployment
    status: NEW
    replacement: >
      They are properties of the image.  Removing the CNN - 71 kB the SOP path
      never calls - made the SOP inversion 5.3 % SLOWER (50.50 -> 53.20 us).
      With -DSOP_NO_ICACHE the same two images give 107.89 (CNN) against 106.38
      (ridge), so the ordering reverses and the smaller image wins.  All twelve
      hot functions moved and eight changed 32-byte alignment.  Published SOP
      timings are now from the deployment image.  See 36.4.
  - id: reproducibility.raw_to_result
    text: >
      raw_rebuild.yaml left 235 moved cells at AUTHOR DECISION REQUIRED.
    table: voltage.csv
    producer: python3 repro/run.py
    ledger: determinism
    status: RESOLVED
    replacement: >
      The defect-excluded rebuild is canonical and eight verified numbers moved
      with it.  Neither the cache nor the committed models were stale - both
      were checked and found identical - the difference was intermittent
      training nondeterminism amplified by fit_alpha's 51-point grid.  See 37.1.
  - id: reproducibility.determinism
    text: >
      Training was seeded but not deterministic.
    table: null
    producer: python3 analysis/determinism.py
    ledger: determinism
    status: RESOLVED
    replacement: >
      analysis/determinism.py pins cuDNN, disables TF32, sets
      CUBLAS_WORKSPACE_CONFIG before the handle exists and raises rather than
      warning.  Proof is end-to-end: the whole chain re-run from scratch moved
      0 of 54 tables and 0 numeric cells.  It also exposed a model that could
      never be reproduced - AdaptiveAvgPool1d has no deterministic CUDA
      backward - now replaced by its exact equivalent.  See 37.5.
  - id: external.temperature_envelope
    text: >
      The ledger said no dataset provides sub-0.30 SOC or off-25 C data.
    table: external_temp_envelope.csv
    producer: python3 repro/run_chen2026_baseline.py
    ledger: blocked_work
    status: CORRECTED
    replacement: >
      False, and it should have been checked before it was written.  RPCWBY
      Test#3 sweeps -20 to 40 C and was already reduced in the repository.
      What it bounds is the NOMINAL 2RC LAYER, not the hybrid: Test#3 has no
      paired drive cycle so the A8 trim cannot be computed on it.  Below 0 C
      the frozen lambda fails outright; from 0 to 40 C no exceedance was
      observed, but on 7-8 points per temperature that is a 31 % one-sided
      upper bound, 9.2 % pooled.  See 37.4.
