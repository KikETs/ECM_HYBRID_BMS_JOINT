soh_arm:
  cnn_vs_baselines:
    status: CONTRADICTED
    detail: >
      Under identical nested cell-held-out splits, identical 64-bin features
      and identical target, ridge regression beats the 10,945-parameter CNN:
      pooled RMSE 0.0094 vs 0.0135, worst cell 0.0130 vs 0.0293.  PLS, SVR
      and gradient boosting also beat it.  Confirmed with a fixed alpha and
      no inner selection (0.0093-0.0095), so it is not a selection artifact.
    implication: "The CNN is not justified on this dataset, and ridge would remove the 17.9 ms SOH inference entirely."
    artifacts: "soh_baselines.csv"
  architecture_naming:
    status: CONTRADICTED
    detail: "analysis/soh_cnn.py is a plain two-layer 1D CNN.  There is no physics or residual term; do not call it physics-aware."
  soh_csv_producer:
    status: VERIFIED
    detail: "soh.csv had no producer at all.  repro/run_soh_table.py now regenerates it byte-identically from results/soh_pred.npz."
  ablations:
    status: VERIFIED
    producer: "python3 repro/run_soh_ablations.py"
    artifact: "analysis/results/tables/soh_ablations.csv"
    representation: >
      dQ/dV (shipped), time-per-voltage-bin, and both concatenated are
      indistinguishable under ridge: 0.0094 / 0.0096 / 0.0095 pooled.  They
      are two views of the same curve.  The choice of representation is not
      load-bearing and should not be presented as one.
    single_feature_baseline: >
      The 3.6-3.7 V band-crossing time alone gives 0.0261, reproducing the
      0.0254 the dataset docstring cites.  The full 64-bin curve is 2.8x
      better, so the curve representation IS worth something over the single
      band - that part of the design does hold.
    window: >
      The full 3.55-4.05 V window is needed.  The low-voltage 48 of 64 bins
      (3.55-3.92 V) gives 0.0132 and the high-voltage 48 gives 0.0169,
      against 0.0094 for the whole window.  This qualifies the docstring's
      claim that "the signal sits at the low-voltage end": the low end is
      the better half, but neither half alone reaches the whole.
    charge_coverage: >
      Read as coverage, a car delivering only the first 25 % of the window
      (3.55-3.67 V) gives 0.0141 and the first 12 % gives 0.0226.
    update_cadence: >
      Refreshing every characterisation gives 0.0095; every 2nd 0.0108;
      every 4th 0.0157; every 8th 0.0302.  Characterisations are every 30
      cycles, so a refresh every ~120 cycles roughly doubles the error.
    cnn_recipe_check: >
      The ablation CNN reproduces the shipped model to 0.0134 against
      soh.csv's 0.0135 once it mirrors soh_cnn.train_fold exactly (mini-batch
      32 plus the MultiStepLR).  A first version used a full-batch loop and
      scored 0.0166, which would have made the CNN column look worse for
      reasons unrelated to the ablation.  Ridge still beats it on every
      input block.

soc_arm:
  headline_number:
    status: CONTRADICTED
    detail: >
      README quotes "2.05 %p under sensor perturbation".  2.05 is the mean
      over all SEVEN rows including the UNDISTURBED case.  The mean over the
      six disturbance conditions is 2.14 %p, which sec 30.4's own table
      prints.  Undisturbed alone is 1.51 %p; worst single condition is
      3.77 %p (current offset -0.10 A).
    artifacts: "soc_headline.csv"
    producer: "python3 repro/run_soc_headline.py"
  per_cell_calibration:
    status: PARTIAL
    detail: >
      build_soc_runs.py constructs ECMSurface(cell, ...) per cell, i.e. the
      evaluated cell's own characterisation surface.  That is per-cell
      calibrated deployment, not leave-one-cell-out.  The wording must say so.
  baselines:
    status: VERIFIED
    producer: "python3 repro/run_soc_baselines.py"
    artifact: "analysis/results/tables/soc_baselines.csv"
    protocol: >
      Same 36 drive runs, same causal sensor inputs, same ECM surfaces and
      the same seven perturbation conditions as soc_perturb_bench.py.  The
      UKF subclasses the EKF so both share the identical model functions and
      only the filter algebra differs.
    result_pct:
      header: "undisturbed / mean over the six disturbances / mean over all seven / worst disturbance"
      coulomb_counting: "0.125 / 6.892 / 5.926 / 10.390"
      one_rc_ekf: "1.511 / 2.185 / 2.088 / 3.929"
      two_rc_ekf_adopted: "1.509 / 2.140 / 2.050 / 3.773"
      adaptive_r_ekf: "0.836 / 3.248 / 2.903 / 8.154"
      dual_ekf_current_bias: "1.654 / 2.072 / 2.012 / 3.304"
      ukf: "1.425 / 2.439 / 2.294 / 4.589"
    findings:
      dual_beats_adopted: >
        The current-bias augmented filter is the best of the six on the
        headline (2.072 vs the adopted 2.140) and clearly best in the worst
        condition (3.304 vs 3.773, 12 % better).  Section 30.8 measured a
        1.9 % gain and recommended leaving it off; on this wider comparison
        it wins on both the mean and the tail.  Whether one extra state is
        worth it is a deployment call, but "not worth it" is no longer what
        the numbers say.
      second_rc_branch_barely_matters: >
        1RC is 2.185 against 2RC's 2.140 - a 2 % difference.  The second RC
        branch buys almost nothing for SOC, which the paper should say
        rather than presenting 2RC as necessary.
      ukf_does_not_pay: >
        The UKF is worse than the EKF (2.439 vs 2.140) at roughly seven
        times the compute.  The model is not nonlinear enough over one
        sample to repay sigma-point propagation.  A clean negative result.
      adaptive_r_reproduces_the_circular_trap: >
        Best of all six undisturbed (0.836) and third worst under
        disturbance (3.248).  This independently reproduces section 30.4:
        the residual-spread rule wins on the circular benchmark and loses on
        the honest one.
      aggregation: >
        mean6 and mean7 differ for every estimator, which is the same
        discrepancy soc_headline.csv records.

sop_baselines:
  status: PARTIAL
  present:
    - "A0 physics-only"
    - "direct RLS plug-in"
    - "two-parameter shrinkage map"
    - "A8 (adopted), A3"
    - "HPPC-RLS upper bound"
    - "pure LSTM over the 12 causal drive blocks (5,954 parameters) - ADDED by the audit"
    - "pure GRU over the same sequence (4,482 parameters) - ADDED by the audit"
    - "forgetting-factor RLS adaptive ECM, block level - ADDED by the audit"
  protocol: >
    Identical leave-one-cell-out splits, identical 12x12 causal input,
    identical output head k = exp(span*tanh(u)), identical Huber loss and
    log-k regulariser, identical Adam/schedule/3 seeds, scored through the
    same eval_sop_amps.py inversion, voltage limits and lambda calibration.
    Sequence-model hyperparameters were declared in advance (hidden 32, one
    layer, 300 epochs) and not tuned on any held-out cell; the FFRLS
    forgetting factor was selected on grouped inner folds of the training
    cells only.
  result_voltage:
    discharge_mV: "GRU 44.8, LSTM 45.4, HPPC-RLS 49.9, A3 58.8, A8 62.8, shrink 69.1, A0 85.4, FFRLS 106.1, direct 134.7"
    charge_mV: "GRU 25.8, LSTM 26.6, HPPC-RLS 33.6, A3 34.1, A8 36.7, shrink 39.8, A0 49.9, FFRLS 65.0, direct 87.3"
  result_current_strict_lambda_tau10:
    discharge_usable_pct: "A3 70.0 [65.5-72.7], A8 69.6 [65.5-72.1], GRU 69.5 [67.1-71.2], LSTM 69.1 [67.0-70.5], shrink 65.0, FFRLS 43.3"
    charge_usable_pct: "LSTM 60.0 [57.7-62.1], GRU 59.9 [58.0-61.6], A8 59.5 [56.3-62.4], A3 58.0 [54.6-61.0], shrink 57.4, FFRLS 49.1"
  finding: >
    The sequence models are 28-30 % better than A8 on voltage RMSE and
    statistically indistinguishable from it on usable current - all four of
    A3, A8, LSTM and GRU have overlapping cell-cluster bootstrap intervals
    in both directions.  A8 reaches that with 4 effective coefficients
    against 4,482-5,954 parameters, roughly 1,100-1,500x fewer, and would
    need ~18-24 KB of flash for the weights alone if deployed.  This is the
    paper's own voltage-does-not-predict-current claim, now demonstrated
    against far larger models rather than only against simpler ones.
  finding_ffrls: >
    A block-level forgetting-factor RLS adaptive ECM plugged straight into
    the resistance is worse than no correction at all (43.3 vs 59.3 %
    usable on discharge), reproducing the direct-plug-in result: an RLS
    estimate of the residual slope must be shrunk before it becomes a
    resistance multiplier.
  limits:
    ffrls_granularity: >
      cache/trim stores exponentially-weighted aggregates per 600 s block,
      not raw samples, so the FFRLS runs at block granularity over 12
      blocks.  A sample-level FFRLS would need the drive cache rebuilt with
      per-sample retention.
    inference_cost: >
      The 38-41 us per-sample figures are GPU-side and are not an MCU
      claim.  No sequence model was ported to the board.
  chen2026:
    status: PARTIAL
    reference: >
      Chen, Yao, Kollmeyer, Vidal, Naguib, Panchal, Emadi, J. Energy Storage
      175 (2026) 123023, CC BY-NC 4.0.  Obtained 2026-08-27; the earlier
      SOURCE REQUIRED is withdrawn.
    what_was_implemented: >
      Their SOP estimator is a model-agnostic binary search on constant
      power (Fig. 1b, eqs 3-4, Table 3 tolerances), which the paper states
      can wrap LSTM, ECM or EM.  That search is implemented exactly and
      driven by this project's pooled 2RC ECM, on RPCWBY Test#3 tau = 10 s
      across all six temperatures, in watts - their metric and units.
      Their LSTM battery model (about 1.05 M parameters, 4.1 MB) was not
      retrained.
    deviation: >
      Their LSTM consumes power directly so eq (3) is one forward pass.  An
      ECM is written in current, so V and I are coupled at constant power
      and eq (3) becomes a fixed point, relaxed here to 1e-6 V.  The 2RC
      states are propagated across the pulse.
    result_rmse_W:
      minus20: "36.19  (bias +29.17 against a measured mean of 30.8 W)"
      minus10: "17.48  (bias +14.79 against 54.4 W)"
      zero: "2.59"
      ten: "4.19"
      twentyfive: "1.67"
      forty: "3.29"
      overall: "16.77 over the 47 of 84 rows the pooled surface can answer"
    chen_published_for_reference: "LSTM 1.87 W overall; their ECM 6.17 W; their EM 7.94 W"
    finding: >
      At 0 C and above, this project's ECM under their search framework
      lands at 1.7-4.2 W, the same order as their published ECM.  At -20 and
      -10 C it is badly optimistic: it predicts nearly double the measured
      power (+29.2 W bias on a 30.8 W mean).  That is direct external
      evidence for the generalization limit recorded in
      manifests/generalization_scope.yaml - the temperature factor is
      borrowed from the Mendeley sweep on a different, un-aged cell, and
      there is no aged low-temperature data anywhere in this project.
    coverage_limit: >
      Only 47 of 84 rows are estimable at all; the pooled surface hull does
      not reach SOC <= 0.1 (18 rows) or SOC >= 0.95 (6 rows).  Chen report
      all rows, so the overall column is not a like-for-like total.
    not_a_controlled_comparison: >
      Their Table 3 sets V_min = 3.2 V, chosen so voltage-limited cases
      appear.  The Test#3 measurements were taken at 2.55-4.1 V per the
      dataset readme, and Table 5's test split ("10 s SOP measurement with
      UDDS discharge profile") does not identify a single sheet in the
      archive.  The run here uses Test#3's documented limits.  Their numbers
      are quoted as published and are indicative only.
    harness_bugs_found_and_fixed: >
      The first version of this harness gave 30.28 W overall.  Three defects
      in it, not in their method: the RC states were recomputed per step
      instead of propagated, so ten one-second steps produced the
      one-second voltage; out-of-hull was conflated with limit-violation, so
      the bisection walked down to 10.8 W against a 107.4 W measurement at
      the SOC = 1.000 hull edge; and a stray `soh and T` expression.
    producer: "python3 repro/run_chen2026_baseline.py"
    artifact: "analysis/results/tables/chen2026_baseline.csv"

  lai2024_fractional_order:
    status: EVIDENCE REQUIRED
    reference: >
      Lai, Yuan, Tang, Zheng, Zhu, Sun, Zhou, Gao, J. Power Sources 594
      (2024) 234000.  Obtained 2026-08-27; the earlier SOURCE REQUIRED is
      withdrawn - the blocker is data, not access.
    blocker: >
      The frequency-dependent integer-order model is identified in the
      FREQUENCY domain from electrochemical impedance spectroscopy, by a
      random-search pseudo-gradient-descent fit to a target EIS trajectory
      (their sec 2.5).  Its three sub-models are then weighted by the
      single-sided amplitude spectrum of the current trajectory (eqs 19a-c).
      Neither UYPYDJ nor RPCWBY contains any EIS measurement - the RPCWBY
      readme lists only time-domain HPPC, drive-cycle and SOP tests.  There
      is nothing to identify the model from.
    what_would_unblock_it: >
      EIS sweeps on the same cells at the same aging states.  Substituting a
      time-domain fit would not be their method and must not be labelled as
      such.
  producer: "python3 repro/run_sop_seq_baselines.py --data cache/trim --suffix '' (and --data cache/trim_chg --suffix _chg), then repro/run_evals.py and repro/run_safety_strict.py --method lstm|gru|ffrls"


external_validation:
  status: VERIFIED_PROCESSED
  detail: >
    The frozen A8 is now scored outside UYPYDJ.  RPCWBY Test#2 is the only
    sheet in either archive carrying a drive cycle (US06) and SOP
    measurements on the SAME cell, which is what a trim indexed on preceding
    drive history needs.  14 characterisations x 12 blocks of US06 features
    were extracted, the frozen A8 weights applied (max over the 12 blocks,
    the deployed convention), and the result run through Chen 2026's
    constant-power search under Test#2's own limits (2.55-4.15 V,
    30 A / -15 A, tau = 10 s).  375 SOP rows, 10 and 25 C, SOH 0.98 to 0.80.
  frozen: >
    Nothing was refitted.  A8 weights and lambda are the UYPYDJ values.  No
    feature, aggregation or tolerance was chosen after seeing an RPCWBY
    number.  All six leave-one-cell-out folds were run - RPCWBY is external
    to every one - so the fold spread states how much the answer depends on
    which fold happens to ship.
  result_watts:
    charge: "A0 8.36 -> A8 7.21 RMSE (-14 %); bias +3.44 -> +2.52..+3.03; fold spread 6.78-8.07"
    discharge: "A0 2.25 -> A8 3.65 RMSE (+62 %); bias +0.05 -> -1.61..-2.11; fold spread 3.44-3.85"
    optimism: "discharge 51.2 % -> 20.7 %; charge 43.1 % -> 44.0 %"
  finding: >
    The trim transfers, and the two directions transfer differently.  On
    charge it improves both accuracy and bias.  On discharge it costs 1.4 W
    of RMSE and buys a sign flip: the bias goes from +0.05 W to about -2 W,
    so the model becomes conservative, and the fraction of rows where it
    over-predicts falls from 51 % to 21 %.  On RMSE that is worse; on the
    adoption criterion this project actually uses - safety, not RMSE - it is
    the direction that counts.  Report both and let the criterion decide.
  limits:
    coverage: "1,656 of 4,356 model calls (38 %) fell outside the pooled surface hull and are excluded."
    temperature: "Test#2 is 10 and 25 C only.  It says nothing about the cold behaviour run_chen2026_baseline.py measured on Test#3."
    single_cell: "One external cell, one laboratory.  Not a population."
  producer: "python3 analysis/rpcwby_us06_trim.py --test 2 && python3 repro/run_external_a8.py"
  artifact: "analysis/results/tables/external_a8.csv"
  do_not: "Do not present Test#3 physics-only results as A8 external validation; that is a different experiment."

mcu_deployment:
  header_firmware_mismatch:
    status: CONTRADICTED
    detail: >
      mcu/fw_sop/Inc/sop_tables.h was an independent FILE, not a symlink to
      mcu/sop_tables.h.  At the base commit it held A3 weights
      (trim_w_dis[0]=0.2283459) while the exporter's output held A8
      (0.2146806).  The firmware that produced the published timings
      compiled A3 trim weights.
    action: "fw_sop/Inc/{sop_tables,soh_tables,soh_qparam}.h are now symlinks; tests/test_mcu.py pins it."
  header_did_not_compile:
    status: CONTRADICTED
    detail: >
      The A8 header emitted 27 literals of the form '0f', an integer constant
      with a float suffix.  gcc and arm-none-eabi-gcc both reject it.  The
      adopted configuration's header had therefore never been built.
    cause: "carr() formatted with '%.7g' + 'f'; exact zeros became '0f'.  A8 has exact zeros because 11 of 12 feature columns are masked."
    action: "export_mcu_tables.py now emits a floating constant; tests/test_mcu.py pins it."
  stage_command_broken:
    status: CONTRADICTED
    detail: "repro/stages.py ran ; the exporter had no --rung argument and exited with argparse error 2.  The exporter's own defaults pointed at runs_trim_v2 (A3)."
    action: "--rung added and cross-checked against the directory; defaults moved to the adopted A8 directories."
  deployment_model:
    status: VERIFIED
    detail: >
      The shipping model is now fitted on all six cells, by a recipe declared
      before it was fitted: the SAME rung, epochs, lr, seeds and lam as the
      leave-one-cell-out folds that were validated, differing only in that no
      cell is held out (sop_trim.py --deployment, written into separate
      runs_trim_a8*_deploy directories so it cannot contaminate the LOCO
      artifacts).  The ECM pool it is exported against is likewise all-cell
      (ecm_pool.build("ALL")); previously no such pool existed and the
      exporter had to borrow one leave-one-out surface.
    fit: "discharge 87.24 -> 60.61 mV (+30.5 %) on 63,108 rows; charge 50.66 -> 35.86 mV (+29.2 %) on 46,848"
    no_heldout_score: >
      By construction this fit has no held-out score.  Every validated number
      stays the LOCO folds.  Nothing is scored on the ALL pool - the guard in
      ecm_pool.build says so in the source.
    binary_evidence: >
      The flashed image contains the all-cell weight 0.2105654 and NOT the
      LOCO-CC fold value 0.2146806 nor the A3 value 0.2283459.
    timing_unchanged: >
      Re-measured after flashing: FULL 50.52 us median against 50.44 for the
      LOCO header, SOLVE 44.00 against 43.98.  Changing which weights ship
      does not change the timing, which is what the array shapes predict.
    parity: "PASS on the deployment header, max relative difference 1.3e-06 over 3000 states."
  parameter_count_language:
    status: VERIFIED
    detail: >
      A8 has 2 non-negligible weights + 2 biases = 4 effective coefficients
      (max |w| on the 11 masked columns is 5.6e-41).  But the header ships a
      12-input layer: 24 weights + 2 biases + 12 mu + 12 sd = 50 floats.
      Write "four effective deployed coefficients", not "four parameters".
  parity:
    status: VERIFIED
    detail: "max relative difference 9.2e-06 over 5000 random states for kf, ks, R_eff and I*; 12/5000 iteration counts differ by 1 (float32 rounding at the stopping threshold)."
    producer: "python3 repro/run_parity.py --n 5000"
  timing:
    status: VERIFIED
    detail: >
      Re-measured on hardware after flashing the rebuilt A8 firmware
      (ELF sha256 10a3b172..., verified by STM32_Programmer_CLI).  Full
      control cycle: median 214.83 us, WCET 307.12 us.  Per-sample subtotal
      13.09 / 13.85 us.  Stack high-water 624 B.  Load at 100 Hz: 2.15 %
      median, 3.07 % worst case.  Published per-stage medians reproduced to
      within 0.01 us.
    detail_binary: "trim_w_dis[0]=0.2146806 (A8) present in the flashed image; the A3 value 0.2283459 absent."
    artifacts: "manifests/mcu_evidence.yaml, mcu/sop_mcu_bench.csv, analysis/results/tables/mcu.csv"
  mcu_csv_producer:
    status: VERIFIED
    detail: "mcu.csv had no producer; repro/run_mcu_table.py now reduces the board CSV to it."
  serial_protocol:
    status: VERIFIED
    detail: >
      Fixed and confirmed on the board.  CEMA_Protocol_Loop used to fall
      through in silence on an unrecognised opcode, so the 72-byte body that
      followed was read back as a stream of command bytes and a valid byte
      inside it produced a plausible response to a command that was never
      handled.  sec 33.7 hit this while probing whether FEAT had been
      compiled out and got 32 bytes back from a binary that provably did not
      contain it.
    fix: >
      An else branch now drains SOP_WIRE_BYTES and replies with
      iters = SOP_NACK_UNKNOWN_CMD (0xFFFFFFFE) and the rejected opcode
      echoed in `cycles`, so a host can tell "not supported" from "wrong
      answer".  Costs 32 bytes of flash.
    measured: >
      Flashed and probed: opcodes 0x7F and 0x00 both return a 32-byte NACK
      with the correct magic and the opcode echoed.  bench_sop.py still runs
      unchanged on the same firmware.
    still_open:
      - "No CRC on the wire."
      - "No length field; the body length is implied by the opcode."

pack:
  status: PARTIAL
  detail: "analysis/sop_pack2.py resamples single-cell rows within condition groups.  No pack hardware, no HIL."
  language: "pack-level simulation sensitivity, never pack validation"
  missing_effects: "inter-cell error correlation beyond the condition bin, shared current trajectory, thermal gradient, SOC imbalance"

end_to_end:
  status: VERIFIED_PROCESSED
  producer: "python3 repro/run_end_to_end.py"
  artifact: "analysis/results/tables/end_to_end.csv"
  method: >
    The four corners of oracle/estimated SOH x oracle/estimated SOC feeding
    the SOP inversion, each scored under strict per-cell held-out lambda.
    SOC estimation is carried in as the adopted EKF's terminal SOC error on
    the drive run nearest at or before each characterisation - the error the
    filter is actually carrying when the pulse happens.  Measured errors:
    mean -0.0096, largest 0.0463 over the 36 runs.
  result_discharge_tau10:
    oracle_oracle: "1 exceedance / 491 rows, lambda 0.683, usable 69.6 %"
    est_soh_oracle_soc: "1 / 514, lambda 0.659, usable 68.5 %"
    oracle_soh_est_soc: "20 / 455, lambda 0.589, usable 66.9 %"
    est_est: "26 / 488, lambda 0.573, usable 65.5 %, worst cell 51.4 %"
  result_charge_tau10:
    oracle_oracle: "1 / 2461, lambda 0.586, usable 59.5 %"
    est_soh_oracle_soc: "3 / 2443, lambda 0.553, usable 57.7 %"
    oracle_soh_est_soc: "1 / 2449, lambda 0.404, usable 41.4 %"
    est_est: "6 / 2430, lambda 0.526, usable 56.3 %"
  finding_soc_dominates: >
    Estimated SOC costs far more than estimated SOH.  Swapping SOH for its
    estimate costs about 1 %p of usable current and leaves exceedance where
    it was.  Swapping SOC for its estimate takes discharge exceedance from
    1 of 491 rows to 20 of 455 - roughly 4 % - and on charge collapses
    lambda from 0.586 to 0.404 and usable current from 59.5 % to 41.4 %.
    The paper's SOP numbers are all computed on the label's own SOC, and
    that is the assumption carrying the most weight.
  finding_exceedance_survives_recalibration: >
    Those 20 and 26 exceedances are AFTER lambda is refitted per held-out
    cell on the same estimated-SOC data.  Recalibration does not absorb the
    SOC error; it is not a bias the safety factor can price out.
  unexplained: >
    On charge the both-estimated corner (56.3 % usable, lambda 0.526) is
    BETTER than oracle-SOH-plus-estimated-SOC (41.4 %, lambda 0.404).  The
    ordering is not monotone.  A plausible reading is that the SOH and SOC
    errors displace the operating point on the resistance surface in
    opposing directions and partially cancel, but that is a guess and was
    not tested.  Do not build an argument on this row.
  limits:
    soc_error_granularity: >
      soc_runs.pkl holds 6 drive runs per cell while SOP labels span far
      more cycles, so one measured EKF error is reused across a stretch of
      cycles.  Real errors at real SOC and aging states, but coarse in cycle.
    row_counts_move: >
      n changes between corners (491 / 514 / 455 / 488 on discharge) because
      shifting SOC moves rows in and out of the trustworthy-label and hull
      filters.  The corners are therefore not scored on identical row sets.
    not_modelled:
      - "sensor dropout and fallback logic"
      - "temperature-sensor error"
      - "drift between the pulse and the end of the preceding drive"
      - "a missing partial-charge observation is covered only through the SOH estimate itself, not as a separate condition"
  claim_limit: >
    The both-estimated corner is the only one a vehicle can execute.  Every
    row above it still receives a ground truth the vehicle does not have.
    Quote the both-estimated row as the system number, or say plainly which
    oracle the quoted number still uses.

reproduction_pipeline:
  stored_table_verification:
    status: VERIFIED
    detail: "43/43 checks pass; verify.py now fails on absent tables, schema drift, row-count drift, non-numeric cells, truncated rows and manifest drift."
  artifact_to_result:
    status: VERIFIED_PROCESSED
    detail: >
      results/eval/ is gitignored, so a fresh clone cannot re-run the safety
      stage until it is rebuilt.  Rebuilt here from the committed trim
      weights: safety.csv, ladder.csv and soh_cost.csv came back
      byte-identical.
  raw_to_result:
    status: VERIFIED_PROCESSED
    detail: >
      Run on 2026-08-27: 30 stages, tiers 1-5, --force, from the raw
      archives.  3.2 h wall clock, no stage failed.  The per-stage minutes
      in stages.py are stale and pessimistic on this machine (the recorded
      total is 13.4 h).
    result: >
      235 differing numeric cells across the schema-compatible tables,
      median relative change 0.073 %, p95 0.607 %, max 6.25 %.  Unchanged
      exactly: every A8 lambda, every A8 usable current, soh.csv in full,
      and mcu / pack / soc_perturb / end_to_end / external_a8.
    cause_is_known_not_noise: >
      Not nondeterminism.  sop_trim_dataset.py carries the drive-defect
      exclusion added in sec 33.4 and the shipped cache predates it.  Sec
      33.4 states this ("rebuilding the dataset next time picks it up
      automatically") and prints the exact numbers a rebuild would give:
      discharge 62.78 mV, charge 36.70 mV.  The rebuild produced 62.78 and
      36.70.  A documented prediction, confirmed by an independent rebuild.
    concentration: >
      The movement concentrates in the BOOST_NEGPULSE column, the single
      cell sec 33.4 identified as carrying defective drive files.  The other
      five move because leave-one-cell-out puts BOOST_NEGPULSE's corrected
      data into their training sets - also predicted in 33.4.
    largest_mover_is_a_grid_quantum: >
      alpha_slow 0.32 -> 0.34 (6.25 %) is one step of the
      np.linspace(0, 1, 51) grid fit_alpha searches, not a drift.
    why_not_verified_outright: >
      The rebuild does not byte-reproduce the shipped tables, and should not
      be reported as if it did.  It reproduces the deployment numbers
      exactly and moves seven voltage RMSE values in the third decimal, for
      a reason the repository itself documents.
    action_taken: >
      The committed artifacts were restored, respecting sec 33.4's recorded
      decision to keep the pre-fix cache.  The rebuilt set is preserved at
      ../preserved/rawrebuild_output/rebuilt_artifacts.tar.gz and compared
      cell by cell in manifests/raw_rebuild.yaml.
    open_choice: AUTHOR DECISION REQUIRED
    open_choice_detail: >
      Adopting the rebuilt set is arguably more correct - the defect
      exclusion is the right processing - but it changes seven published
      voltage RMSE values and the spec tables in 32.2 and 32.6 that quote
      them.  The audit did not make that switch silently.
    byte_level_reproduction:
      cache: >
        All 12 cache_t files rebuilt from the raw archives are BIT-IDENTICAL
        to the reference cache - same sample counts (55,078,978 drive plus
        9,734,557 HPPC) and byte-equal voltage arrays.
      intermediates: >
        8 of the 9 tracked intermediate CSVs reproduce byte-for-byte:
        temp_audit_all, uypydj_ocv, uypydj_hppc_resistance, uypydj_ecm,
        mendeley_ecm, ecm_temp_factor, sop_label_measured, sop_label_charge.
      the_ninth: >
        rpcwby_ecm.csv does not: the rebuild writes 2,865 rows against the
        committed 3,451.  It is an orphan - nothing in the repository reads
        it - and it has TWO producers that disagree, rpcwby_to_ecm.py and
        rpcwby_resistance.py.  The stage this audit added runs the former
        without checking which had produced the committed file.  No
        published number depends on it.  Marked in stages.py; pick one
        producer or delete the artifact.
      only_script_that_skips: >
        build_uypydj_cache.py was the only stage script with skip-if-exists
        logic.  The other twelve rewrite unconditionally, so --force not
        propagating affected the cache stage alone.

    defects_found_by_this_run:
      - "The cache stage declared 12 outputs and its command built 6: build_uypydj_cache.py --part defaults to Fifteen_Drive_Cycles and the second invocation was missing.  run.py reported the stage done because it exited 0."
      - "run.py treated exit 0 as completion without checking the declared outputs existed - the same hole verify.py had, closed earlier in this audit."
      - "repro/run.py --force did not reach the stage scripts: build_uypydj_cache.py skips existing outputs and had no --force, so a forced rebuild silently reused what was on disk.  Stages now declare a force_flag and run.py appends it."
  stage_graph_defects_fixed:
    - "temp_factor declared rpcwby_ecm.csv but ecm_temp_factor.py reads mendeley_ecm.csv"
    - "no stage produced rpcwby_ecm.csv or mendeley_ecm.csv (added)"
    - "soc_runs did not declare uypydj_ecm.csv / uypydj_ocv.csv / ecm_temp_factor.csv, which ECMSurface opens"
    - "cold_ratio.csv, build_size.csv and soh_cost.csv were produced but undeclared"
    - "mcu_measure claimed to output mcu.csv; nothing wrote it"
    - "run_evals.py set stderr=PIPE and never read it, and treated a missing trim directory as a skip"
    - "run_extras.py read cold-check input from /tmp"

