# What is frozen, and what a rerun is allowed to change.
version: 1
audited: "2026-08-27"

frozen:
  - artifact: analysis/runs_trim_a8/, analysis/runs_trim_a8_chg/
    what: "adopted SOP trim (A8), 6 LOCO folds x 3 seeds"
    frozen_because: "every SOP number in the paper descends from these"
    reproduces: "results/eval/ regenerated from them gives safety.csv, ladder.csv and soh_cost.csv byte-identically (checked 2026-08-27)"
  - artifact: analysis/results/soh_pred.npz
    what: "SOH CNN predictions, 6 LOCO folds x 3 seeds"
    reproduces: "soh.csv byte-identically via repro/run_soh_table.py"
  - artifact: mcu/sop_tables.h
    sha256_after_fix: "regenerated during the audit; the pre-audit file did not compile"
    what: "A8 ECM grid + OCV + trim weights"
  - artifact: mcu/sop_mcu_bench.csv
    what: "board timing, n=500 per stage, A8 firmware"
    superseded: "the pre-audit A3-firmware measurement is preserved at ../preserved/sop_mcu_bench.a3header.csv"

not_frozen:
  - "results/eval/ — gitignored, rebuilt by repro/run_evals.py in ~1 min from the frozen trim weights"
  - "analysis/cache/, analysis/cache_t/ — 4.6 GB, rebuilt from raw"

changed_during_audit:
  - "mcu/sop_tables.h: regenerated so it compiles (0f -> 0.0f) and from the A8 directories"
  - "mcu/fw_sop/Inc/{sop_tables,soh_tables,soh_qparam}.h: file -> symlink"
  - "mcu/sop_mcu_bench.csv + analysis/results/tables/mcu.csv: re-measured on the A8 firmware"
  - "analysis/results/tables/voltage.csv: gained a tau_s column (pooled rows reproduce the old values)"
  - "repro/expected.json: voltage checks re-keyed with tau_s=pooled; schema and completeness manifest added"

preserved:
  path: "../preserved/results_original_fa44137.tar.gz"
  contents: "analysis/results, mcu/sop_mcu_bench*.csv and the five figures as of the base commit"

second_round_2026_08_31:
  changed:
    - "mcu/sop_tables.h: unchanged in content, but repro/stages.py mcu_export now regenerates it with --deployment and the all-cell run directories.  Before this the stage would have replaced the shipped header with a leave-one-cell-out fold on any rerun."
    - "manifests/mcu_evidence.yaml: rewritten from a rebuild + reflash + rebench on hardware.  It had been recording the CC fold and a header hash matching no file in the tree."
    - "analysis/results/tables/{alpha,correlation,ladder,safety,safety_strict_*,soh_cost}.csv: regenerated from the corrected raw rebuild.  Every difference is in the last printed digit except ladder.disc.shrink, 62.4 -> 62.0."
    - "analysis/results/tables/build_size.csv: gained the a8_only row; text 143932 -> 143964 for the comparison build (all-cell constant pool)."
    - "repro/expected.json: ladder.disc.shrink updated to the rebuilt value; mcu.build.both, mcu.build.a8_only and six second-round checks added (51 -> 59)."
  new_artifacts:
    - "analysis/results/tables/end_to_end_paired.csv — the four corners on the rows all four keep"
    - "analysis/results/tables/end_to_end_drift.csv — the rows each corner keeps that the intersection does not"
    - "analysis/results/tables/external_a8_coverage.csv — in-hull share by SOC, temperature, SOH and direction"
    - "analysis/results/tables/external_a8_safety.csv — does the frozen lambda transfer"
  not_changed:
    - "mcu/sop_mcu_bench.csv — kept as the record of the run that produced the published mcu.csv.  An independent n=500 sweep on the freshly flashed image reproduced it (FULL median 50.52 us), so there was nothing to correct."
    - "analysis/runs_trim_a8*/ — the frozen fits.  Nothing was refitted in this round."
  preserved:
    path: ".preserved/2026-08-31_{paired,mcu_allcell,tables}/"
    contents: "end_to_end.csv, mcu.csv, sop_mcu_bench.csv, mcu_evidence.yaml, all 44 tables and expected.json as they stood before this round"
    tracked: false
    why_not_tracked: "same policy as the first round's ../preserved/ tarball: kept on the machine that did the work, not in the repository"
