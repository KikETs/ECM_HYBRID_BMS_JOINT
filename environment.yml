# CPU environment.  Reproduces every stored-table verification, all figures,
# and CPU training.  For CUDA training use environment-gpu.yml instead.
#
# Versions are pinned to the interpreter these results were produced on;
# env/requirements.lock.txt carries the exact pip freeze.
#
# NumPy must stay on 2.x: the code calls np.ptp(arr), and arr.ptp() was
# removed in NumPy 2.0, so downgrading to 1.x silently changes behaviour.
name: samsung30t
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy=2.3.*
  - scipy=1.16.*
  - pandas=3.0.*
  - matplotlib=3.10.*
  - openpyxl=3.1.*        # reads the RPCWBY/Mendeley .xlsx summaries
  - pyserial=3.5.*        # mcu/bench_sop.py talks to the board over USART3
  - pytest=9.*            # tests/
  - ruff                  # lint
  - pip
  - pip:
      - torch==2.9.1      # CPU wheel; SOP trim and SOH CNN training only
